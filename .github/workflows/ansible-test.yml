name: Ansible Collection Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install just
        uses: extractions/setup-just@v1
        with:
          just-version: '1.13.0'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          just setup

      - name: Run linting
        run: just lint

      - name: Run sanity tests
        run: just sanity