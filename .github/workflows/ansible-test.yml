name: Ansible Collection Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install just
        uses: extractions/setup-just@v1
        with:
          just-version: '1.13.0'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: just setup

      - name: Run linting
        run: just lint

      - name: Run sanity tests
        run: just sanity