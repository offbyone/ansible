name: Ansible Collection Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint

      - name: Install collection requirements
        run: |
          pip install -r requirements.txt
          pip install authlib

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run yamllint
        run: |
          yamllint .

  sanity:
    name: Sanity Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          path: ansible_collections/offbyone/ansible

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install collection requirements
        working-directory: ansible_collections/offbyone/ansible
        run: |
          pip install -r requirements.txt
          pip install authlib

      - name: Run ansible-test sanity
        working-directory: ansible_collections/offbyone/ansible
        run: ansible-test sanity --docker -v